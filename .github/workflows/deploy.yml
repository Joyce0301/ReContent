name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: recontent
      ECS_CLUSTER: default
      ECS_SERVICE: recontent-b13f
      ECS_CONTAINER_NAME: Main
      AVATAR_S3_BUCKET: recontent-avatar-pipeline-20260726
      EXPECTED_AVATAR_RUNTIME_REGION: us-east-1
      EXPECTED_AVATAR_TASK_ROLE_ARN: arn:aws:iam::881424867096:role/recontent-ecs-task-role
      AVATAR_TASK_ROLE_NAME: recontent-ecs-task-role
      AVATAR_TASK_POLICY_NAME: recontent-avatar-originals-access
      GITHUB_DEPLOY_ROLE_NAME: github-actions-recontent-deploy
      AVATAR_ALLOWED_ORIGIN: https://re-6718725ab2374d34942ac6eee4abd640.ecs.us-east-1.on.aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881424867096:role/github-actions-recontent-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify avatar S3 deployment prerequisites
        run: node scripts/verify-avatar-s3-prerequisites.mjs

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tags
        id: image-meta
        run: |
          set -euo pipefail

          SHORT_SHA="sha-${GITHUB_SHA::8}"
          RELEASE_TAG=""

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          echo "short-sha-tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REPOSITORY:${{ steps.image-meta.outputs.short-sha-tag }} .

      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:${{ steps.image-meta.outputs.short-sha-tag }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.image-meta.outputs.short-sha-tag }}

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag $ECR_REPOSITORY:${{ steps.image-meta.outputs.short-sha-tag }} \
              ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest
          fi

          if [ -n "${{ steps.image-meta.outputs.release-tag }}" ]; then
            docker tag $ECR_REPOSITORY:${{ steps.image-meta.outputs.short-sha-tag }} \
              ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.image-meta.outputs.release-tag }}
          fi

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.image-meta.outputs.short-sha-tag }}

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest
          fi

          if [ -n "${{ steps.image-meta.outputs.release-tag }}" ]; then
            docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.image-meta.outputs.release-tag }}
          fi

      - name: Get current ECS task definition
        id: task-def
        run: |
          set -euo pipefail

          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'] | [0].taskDefinition" \
            --output text)

          echo "Resolved task definition: $TASK_DEFINITION"

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "Failed to resolve ECS task definition for service $ECS_SERVICE in cluster $ECS_CLUSTER"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE"
            exit 1
          fi

          echo "task-definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ steps.task-def.outputs.task-definition }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-meta.outputs.short-sha-tag }}
          environment-variables: |
            PORT=80

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
