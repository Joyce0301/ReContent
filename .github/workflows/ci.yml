name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "skills/**"
      - "AGENTS.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "skills/**"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          npx vitest run \
            app/api/repurpose/*.test.ts \
            app/api/auth/*/route.test.ts \
            app/api/profile/avatar/route.test.ts \
            app/api/profile/avatar/upload-intent/route.test.ts \
            app/api/profile/avatar/confirm/route.test.ts \
            app/lib/auth/*.test.ts \
            app/lib/avatar/*.test.ts \
            app/lib/http/*.test.ts \
            app/components/recontent/header.test.tsx \
            app/profile/*.test.tsx \
            app/workspace/*.test.tsx \
            app/page.test.tsx \
            scripts/verify-avatar-lambda-prerequisites.test.ts \
            scripts/verify-avatar-s3-prerequisites.test.ts \
            --exclude app/api/repurpose/content-extraction.live.test.ts

      # Keep this before Lambda install so ECS builds cannot depend on
      # lambda/avatar-processor/node_modules by accident.
      - name: Build
        run: npm run build

      - name: Build OpenNext artifact
        run: npx --no-install opennextjs-cloudflare build --skipNextBuild

      - name: Install avatar Lambda dependencies
        run: npm ci --prefix lambda/avatar-processor

      - name: Test avatar Lambda
        run: |
          npm test --prefix lambda/avatar-processor
          npm run typecheck --prefix lambda/avatar-processor

      - name: Build avatar Lambda ZIP
        run: npm run build:zip --prefix lambda/avatar-processor

      - name: Build Docker image
        run: docker build -t recontent:ci .
