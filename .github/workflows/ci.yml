name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          npx vitest run \
            app/api/repurpose/*.test.ts \
            app/api/auth/*/route.test.ts \
            app/api/profile/avatar/route.test.ts \
            app/lib/auth/*.test.ts \
            app/lib/avatar/*.test.ts \
            app/components/recontent/header.test.tsx \
            app/profile/*.test.tsx \
            app/workspace/*.test.tsx \
            app/page.test.tsx \
            --exclude app/api/repurpose/content-extraction.live.test.ts

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t recontent:ci .
